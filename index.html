<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hibachi — Airdrop Calculator</title>
<meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none';">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --orange:  #FB743F;
  --red:     #FE344A;
  --ink:     #0F0F15;
  --paper:   #16161D;
  --paper2:  #1C1C26;
  --white:   #FFFFFF;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--paper);
  color: var(--orange);
  font-family: 'Bangers', cursive;
  padding: 16px;
  background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 22px 22px;
  min-height: 100vh;
}

.wrapper { max-width: 900px; margin: 0 auto; }

header { text-align: center; margin-bottom: 20px; }
.brand-logo { height: 56px; width: auto; filter: drop-shadow(3px 3px 0 var(--ink)); }

/* ─── GRID ─── */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

/* ─── PANELES ─── */
.panel {
  background: var(--paper2);
  border: 2px solid var(--orange);
  padding: 16px;
  box-shadow: 2px 2px 0 var(--orange);
  border-radius: 10px;
}
.panel-full { grid-column: 1 / -1; }
.panel h2 {
  font-size: clamp(16px, 3vw, 22px);
  margin-bottom: 12px;
  color: var(--orange);
  text-transform: uppercase;
  letter-spacing: 1px;
}

label { display: block; margin-bottom: 3px; font-size: clamp(13px, 2vw, 17px); color: var(--white); }

input[type="number"], input[type="text"] {
  width: 100%; padding: 8px 10px; margin-bottom: 12px;
  border: 3px solid var(--ink); border-radius: 4px;
  font-family: 'Bangers', cursive; font-size: clamp(15px, 2.5vw, 19px);
  background: #000; color: #fff;
}

input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; margin: 6px 0 14px; }
input[type="range"]::-webkit-slider-runnable-track { height: 10px; background: var(--ink); border-radius: 5px; }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; height: 24px; width: 24px; background: var(--orange);
  border: 3px solid var(--ink); border-radius: 50%; cursor: pointer; margin-top: -7px;
}

.slider-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
.slider-val { color: #fff; font-size: clamp(15px, 2vw, 20px); }

/* ─── RESULT BAR ─── */
.result-bar {
  grid-column: 1 / -1;
  background: var(--paper2);
  border: 2px solid var(--orange);
  display: flex; justify-content: space-around; align-items: center;
  padding: 14px 16px; gap: 10px; flex-wrap: wrap;
  box-shadow: 2px 2px 0 var(--orange); border-radius: 10px;
}
.res-item { text-align: center; }
.res-lbl  { font-size: clamp(11px, 1.8vw, 18px); color: var(--orange); opacity: 0.9; }
.res-val  { font-size: clamp(18px, 3.5vw, 28px); color: var(--white); }
.res-main { font-size: clamp(28px, 6vw, 54px); color: #fff; text-shadow: 3px 3px 0 var(--ink); }

/* ─── TABS ─── */
.tabs { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
.tab-btn {
  flex: 1; min-width: 80px; padding: 7px 6px; cursor: pointer;
  border: 3px solid var(--ink); border-radius: 4px;
  background: var(--paper); color: #fff;
  font-family: 'Bangers', cursive; font-size: clamp(12px, 2vw, 15px);
}
.tab-btn.active { background: var(--orange); }

.search-row { display: flex; gap: 8px; }
.btn-add {
  background: var(--orange); color: var(--white);
  border: 3px solid var(--ink); border-radius: 4px;
  font-family: 'Bangers', cursive; padding: 0 16px;
  cursor: pointer; font-size: clamp(15px, 2.5vw, 19px); white-space: nowrap;
}

/* ─── NFT EDITOR GRID ─── */
.nft-grid-edit {
  margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px;
  min-height: 90px; padding: 10px;
  background: rgba(0,0,0,0.2); border-radius: 10px;
}
.nft-card-edit {
  width: clamp(64px, 13vw, 84px);
  background: var(--ink); border: 3px solid var(--orange);
  border-radius: 10px; position: relative; overflow: hidden;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
}
.nft-card-edit img { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }
.nft-id-tag {
  color: #fff; background: var(--orange);
  font-size: 10px; text-align: center; padding: 3px 2px;
}
.remove-btn {
  position: absolute; top: 2px; right: 2px;
  background: var(--red); color: #fff;
  border: 2px solid var(--ink); border-radius: 50%;
  width: 19px; height: 19px; cursor: pointer; z-index: 2;
  font-family: 'Comic Neue', cursive; font-weight: bold; font-size: 11px;
  display: flex; align-items: center; justify-content: center;
}

/* ─── CAPTURE AREA ─── */
/* Mismo ancho que .wrapper, mismo estilo que .panel */
#capture-area {
  background: var(--paper2);
  border: 2px solid var(--orange);
  box-shadow: 2px 2px 0 var(--orange);
  border-radius: 10px;
  padding: clamp(16px, 3vw, 32px);
  width: 100%;
  position: relative;
  overflow: hidden;
}

/* ─── CARD HEADER ─── */
.s-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
}
.s-val-lg { font-size: clamp(40px, 9vw, 88px); line-height: 0.85; color: var(--white); }
.s-val-xl { font-size: clamp(40px, 9vw, 88px); line-height: 0.85; color: var(--white); text-align: right; }

/* ─── CARD STATS ─── */
.s-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px;
}
.s-stat-item {
  background: var(--paper2); border: 2px solid var(--orange);
  padding: clamp(6px, 1.5vw, 12px); text-align: center; border-radius: 6px;
}
.s-stat-item div { font-size: clamp(10px, 1.6vw, 16px); color: var(--orange); }
.s-stat-item b   { font-size: clamp(12px, 2vw, 20px); color: var(--white); }

/* ─── NFT GRID EN CARD ─── */
.s-nft-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.s-group {
  border: 2px solid var(--ink); border-radius: 6px;
  padding: 6px; background: rgba(0,0,0,0.15); opacity: 0.3;
}
.s-group.active { opacity: 1; border-color: var(--orange); }
.s-group-title {
  font-size: clamp(18px, 3vw, 26px); color: #fff;
  margin-bottom: 5px; text-align: center;
  border-bottom: 1px solid var(--orange); padding-bottom: 3px;
}

/* ── LAYOUTS: alturas asignadas por JS para que html2canvas las respete ── */

/* LAYOUT-1: 1 NFT */
.s-row.layout-1 { display: block; }
.s-row.layout-1 .s-img {
  width: 100%;
  border-radius: 4px; overflow: hidden;
  /* height se asigna por JS */
}
.s-row.layout-1 .s-img img {
  width: 100%; height: 100%; display: block; object-fit: cover;
  flex-shrink: 0;
}

/* LAYOUT-FEW: 2-3 NFTs apilados */
.s-row.layout-few { display: flex; flex-direction: column; gap: 4px; }
.s-row.layout-few .s-img {
  width: 100%;
  border-radius: 4px; overflow: hidden;
  flex-shrink: 0;
  /* height se asigna por JS */
}
.s-row.layout-few .s-img img {
  width: 100%; height: 100%; display: block;
  object-fit: cover; object-position: center 25%;
  flex-shrink: 0;
}
#g-leg25 .s-row.layout-few .s-img img,
#g-hid225 .s-row.layout-few .s-img img {
  object-position: center 38%;
}

/* LAYOUT-MANY: 4-9 NFTs grid 3 col */
.s-row.layout-many {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px;
}
.s-row.layout-many .s-img {
  border-radius: 3px; overflow: hidden;
  /* height se asigna por JS */
}
.s-row.layout-many .s-img img {
  width: 100%; height: 100%; display: block; object-fit: cover;
}

/* ─── FOOTER CARD ─── */
.s-footer {
  margin-top: 14px; display: flex; justify-content: space-between; align-items: center;
  border-top: 2px solid var(--orange); padding-top: 10px;
}
.s-logo { height: clamp(30px, 5vw, 54px); width: auto; filter: drop-shadow(2px 2px 0 var(--ink)); }
.s-ref { font-size: clamp(16px, 3.5vw, 32px); color: var(--white); }
.s-url { font-size: clamp(16px, 3.5vw, 32px); color: var(--orange); }

/* ─── BOTONES EXPORT ─── */
.actions { display: flex; gap: 10px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }
.btn-act {
  padding: clamp(9px, 2vw, 13px) clamp(14px, 3vw, 26px);
  font-family: 'Bangers', cursive; font-size: clamp(15px, 2.5vw, 21px);
  cursor: pointer; border: 2px solid var(--ink);
  box-shadow: 4px 4px 0 var(--ink); transition: 0.1s; border-radius: 6px;
}
.btn-act:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
.btn-blue  { background: var(--orange); color: #fff; }
.btn-green { background: #27ae60; color: #fff; }
.btn-tw    { background: #1DA1F2; color: #fff; }

/* ─── RESPONSIVE ─── */
@media (max-width: 620px) {
  .main-grid { grid-template-columns: 1fr; }
  .result-bar { flex-direction: column; gap: 8px; }
  .s-stats { grid-template-columns: repeat(2, 1fr); }
  .actions { flex-direction: column; align-items: stretch; }
  .btn-act  { text-align: center; }
  body      { padding: 10px; }
}
@media (max-width: 380px) {
  .s-val-lg, .s-val-xl { font-size: 34px; }
  .s-stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

  <div id="capture-area">

</div>

let myNfts = { leg25: [], hid225: [], flame: [] };

const IMG_PATH = {
  leg25:  id => `legendary/${id}${EXT}`,
  hid225: id => `hidden/${id}${EXT}`,
  flame:  id => `flame/${id}${EXT}`
};

function setTab(t, btn) {
  currentTab = t;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderEditor();
}

function addNFT() {
  const input = document.getElementById('nftIn');
  const val   = input.value.trim().toLowerCase();
  if (!val) return;
  if (Object.values(myNfts).flat().length >= 9) return;
  let found = null;
  if (currentTab === 'flame') {
    found = DATA_FLAME.find(n => n.id.toString() === val || n.name.toLowerCase() === val);
  } else {
    const max = currentTab === 'leg25' ? 25 : 225;
    if (!isNaN(val) && +val >= 1 && +val <= max) found = { id: +val, name: '#' + val };
  }
  if (found && !myNfts[currentTab].find(x => x.id === found.id)) {
    myNfts[currentTab].push(found);
    input.value = '';
    update();
  }
}

function removeNFT(tab, id) {
  myNfts[tab] = myNfts[tab].filter(x => x.id !== id);
  update();
}

function renderEditor() {
  const grid = document.getElementById('editGrid');
  grid.innerHTML = '';
  myNfts[currentTab].forEach(n => {
    grid.innerHTML += `
      <div class="nft-card-edit">
        <button class="remove-btn" onclick="removeNFT('${currentTab}',${n.id})">×</button>
        <img src="${IMG_PATH[currentTab](n.id)}" onerror="this.style.display='none'">
        <div class="nft-id-tag">${n.name}</div>
      </div>`;
  });
}

/* Smart layout: 1 → cuadrado | 2-3 → rectángulos apilados | 4-9 → grid 3col
   Las alturas se asignan en px via JS para que html2canvas las respete exactamente */
function renderCardGroup(tab) {
  const g    = document.getElementById(`g-${tab}`);
  const row  = document.getElementById(`r-${tab}`);
  const nfts = myNfts[tab];

  row.innerHTML = '';

  if (nfts.length === 0) {
    g.classList.remove('active');
    return;
  }

  g.classList.add('active');

  let cls = 'layout-many';
  if (nfts.length === 1)      cls = 'layout-1';
  else if (nfts.length <= 3)  cls = 'layout-few';

  row.className = `s-row ${cls}`;

  nfts.forEach(n => {
    row.innerHTML += `
      <div class="s-img">
        <img src="${IMG_PATH[tab](n.id)}" onerror="this.parentElement.style.display='none'">
      </div>`;
  });

  // Asignar alturas px reales tras render (mide y aplica en el mismo frame)
  requestAnimationFrame(() => {
    const m = measureImgHeights();
    applyImgHeights(document, m);
  });
}

function fmt(n, dec = 0) {
  return n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function update() {
  const pts    = parseFloat(document.getElementById('inPoints').value) || 0;
  const fdv    = parseFloat(document.getElementById('slFdv').value) * 1e6;
  const air    = parseFloat(document.getElementById('slAir').value) / 100;
  const supply = parseFloat(document.getElementById('slSupply').value) * 1e6;
  const ppp    = supply > 0 ? (fdv * air) / supply : 0;
  const total  = ppp * pts;

  document.getElementById('valFdv').innerText    = '$' + fmt(fdv / 1e6) + 'M';
  document.getElementById('valAir').innerText    = fmt(air * 100) + '%';
  document.getElementById('valSupply').innerText = fmt(supply / 1e6) + 'M';

  document.getElementById('resPpp').innerText    = '$' + fmt(ppp, 4);
  document.getElementById('resTotal').innerText  = '$' + fmt(total);
  document.getElementById('resPct').innerText    = supply > 0 ? fmt((pts / supply) * 100, 2) + '%' : '0.00%';

  document.getElementById('sPoints').innerText   = fmt(pts);
  document.getElementById('sValue').innerText    = '$' + fmt(total);
  document.getElementById('sPpp').innerText      = '$' + fmt(ppp, 4);
  document.getElementById('sFdv').innerText      = '$' + fmt(fdv / 1e6) + 'M';
  document.getElementById('sAir').innerText      = fmt(air * 100) + '%';
  document.getElementById('sSupply').innerText   = fmt(supply / 1e6) + 'M';
  document.getElementById('sRef').innerText      = document.getElementById('inRef').value;

  renderEditor();

  let totalCount = 0;
  ['leg25','hid225','flame'].forEach(tab => {
    totalCount += myNfts[tab].length;
    renderCardGroup(tab);
  });
  document.getElementById('count').innerText = totalCount;
}

// Mide alturas reales del DOM y las devuelve como mapa { tabId: heightPx }
function measureImgHeights() {
  const result = {};
  ['leg25','hid225','flame'].forEach(tab => {
    const row = document.getElementById('r-' + tab);
    if (!row) return;
    const cls = row.className;
    const sImgs = row.querySelectorAll('.s-img');
    if (!sImgs.length) return;

    // Usamos el ancho del grupo padre (.s-group) que es el ancho real disponible
    // menos el padding (6px cada lado = 12px total)
    const group = document.getElementById('g-' + tab);
    const groupW = group ? Math.round(group.getBoundingClientRect().width) : 0;
    const innerW = groupW - 12; // restar padding 6px × 2

    let h = 0;
    if (cls.includes('layout-1')) {
      h = innerW; // cuadrado 1:1
    } else if (cls.includes('layout-few')) {
      h = Math.round(innerW * 5 / 16); // ratio 16:5
    } else if (cls.includes('layout-many')) {
      h = Math.round((innerW - 6) / 3); // grid 3col con 2 gaps de 3px
    }
    result[tab] = { cls, h };
  });
  return result;
}

// Aplica alturas medidas (en px) a un documento (real o clon)
// Se fija tanto en el contenedor .s-img como en el <img> hijo para evitar estiramientos
function applyImgHeights(doc, measurements) {
  ['leg25','hid225','flame'].forEach(tab => {
    if (!measurements[tab]) return;
    const { h } = measurements[tab];
    if (!h) return;
    const row = doc.getElementById('r-' + tab);
    if (!row) return;
    row.querySelectorAll('.s-img').forEach(el => {
      el.style.height        = h + 'px';
      el.style.minHeight     = h + 'px';
      el.style.maxHeight     = h + 'px';
      el.style.overflow      = 'hidden';
      el.style.flexShrink    = '0';
      const img = el.querySelector('img');
      if (img) {
        img.style.width      = '100%';
        img.style.height     = h + 'px';   // px explícito, no 100%
        img.style.minHeight  = h + 'px';
        img.style.maxHeight  = h + 'px';
        img.style.objectFit  = 'cover';
        img.style.display    = 'block';
        img.style.flexShrink = '0';
      }
    });
  });
}

async function captureCard() {
  const el = document.getElementById('capture-area');

  // 1. Medir alturas reales en el DOM visible
  const measurements = measureImgHeights();

  // 2. Aplicar al DOM real para que la pantalla también sea coherente
  applyImgHeights(document, measurements);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  // 3. Capturar — en onclone aplicamos las MISMAS alturas medidas al clon
  //    así html2canvas ve exactamente las mismas px que el usuario ve en pantalla
  const canvas = await html2canvas(el, {
    useCORS: true,
    scale: 2,
    backgroundColor: '#16161D',
    logging: false,
    imageTimeout: 15000,
    allowTaint: false,
    onclone: (clonedDoc) => {
      applyImgHeights(clonedDoc, measurements);
    }
  });

  const targetWidth = 1600;
  const scale = targetWidth / canvas.width;
  const targetHeight = Math.round(canvas.height * scale);

  const tw = document.createElement('canvas');
  tw.width  = targetWidth;
  tw.height = targetHeight;

  const ctx = tw.getContext('2d');
  ctx.fillStyle = '#16161D';
  ctx.fillRect(0, 0, tw.width, tw.height);
  ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, targetWidth, targetHeight);

  return tw;
}

async function downloadCard(btn) {
  const old = btn.innerText; btn.innerText = '⏳ WAIT…';
  try {
    const tw   = await captureCard();
    const link = document.createElement('a');
    link.download = 'hibachi-airdrop.png';
    link.href     = tw.toDataURL('image/png');
    link.click();
    btn.innerText = '✅ DONE!';
  } catch(e) { console.error(e); btn.innerText = '❌ ERROR'; }
  setTimeout(() => btn.innerText = old, 2500);
}

async function copyCard(btn) {
  const old = btn.innerText; btn.innerText = '⏳ COPYING…';
  try {
    const tw = await captureCard();
    tw.toBlob(async blob => {
      try {
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        btn.innerText = '✅ COPIED!';
      } catch { btn.innerText = '❌ FAILED'; }
    }, 'image/png');
  } catch(e) { console.error(e); btn.innerText = '❌ FAILED'; }
  setTimeout(() => btn.innerText = old, 2500);
}

function tweetShare() {
  const val = document.getElementById('sValue').innerText;
  window.open(
    `https://twitter.com/intent/tweet?text=${encodeURIComponent(`My estimated $HIBACHI airdrop is ${val} 🔥\n\n@hibachi_xyz #HibachiAirdrop`)}`,
    '_blank'
  );
}

update();
</script>
