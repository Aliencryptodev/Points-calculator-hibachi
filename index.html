<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hibachi — Airdrop Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --orange:  #FB743F;
  --red:     #FE344A;
  --ink:     #000000;
  --paper:   #0F0F15;
  --paper2:  #16161D;
  --white:   #FFFFFF;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--paper);
  color: var(--orange);
  font-family: 'Bangers', cursive;
  padding: 16px;
  background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 22px 22px;
  min-height: 100vh;
}

.wrapper { max-width: 900px; margin: 0 auto; }

header { text-align: center; margin-bottom: 20px; }
.brand-logo { height: 56px; width: auto; filter: drop-shadow(3px 3px 0 var(--ink)); }

/* ─── GRID PRINCIPAL ─── */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.panel {
  background: var(--paper2);
  border: 3px solid var(--ink);
  padding: 16px;
  box-shadow: 6px 6px 0 var(--ink);
  border-radius: 4px;
}
.panel-full { grid-column: 1 / -1; }
.panel h2 {
  font-size: clamp(16px, 3vw, 22px);
  margin-bottom: 12px;
  color: var(--orange);
  text-transform: uppercase;
}

label { display: block; margin-bottom: 3px; font-size: clamp(13px, 2vw, 17px); color: var(--white); }

input[type="number"], input[type="text"] {
  width: 100%; padding: 8px 10px; margin-bottom: 12px;
  border: 3px solid var(--ink); border-radius: 4px;
  font-family: 'Bangers', cursive; font-size: 18px;
  background: #000; color: #fff;
}

input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; margin: 6px 0 14px; }
input[type="range"]::-webkit-slider-runnable-track { height: 10px; background: var(--ink); border-radius: 5px; }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; height: 24px; width: 24px; background: var(--orange);
  border: 3px solid var(--ink); border-radius: 50%; cursor: pointer; margin-top: -7px;
}

.slider-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
.slider-val { color: #fff; font-size: 18px; }

/* ─── RESULT BAR ─── */
.result-bar {
  grid-column: 1 / -1;
  background: var(--paper2);
  border: 3px solid var(--ink);
  display: flex; justify-content: space-around; align-items: center;
  padding: 14px 16px; gap: 10px; flex-wrap: wrap;
  box-shadow: 6px 6px 0 var(--ink); border-radius: 4px;
}
.res-item { text-align: center; }
.res-lbl  { font-size: 14px; color: var(--orange); }
.res-val  { font-size: 24px; color: var(--white); }
.res-main { font-size: clamp(28px, 6vw, 54px); color: #fff; text-shadow: 3px 3px 0 var(--ink); }

/* ─── TABS & EDITOR ─── */
.tabs { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
.tab-btn {
  flex: 1; min-width: 80px; padding: 7px 6px; cursor: pointer;
  border: 3px solid var(--ink); border-radius: 4px;
  background: var(--paper); color: #fff;
  font-family: 'Bangers', cursive;
}
.tab-btn.active { background: var(--orange); }

.search-row { display: flex; gap: 8px; }
.btn-add {
  background: var(--orange); color: var(--white);
  border: 3px solid var(--ink); border-radius: 4px;
  font-family: 'Bangers', cursive; padding: 0 16px; cursor: pointer;
}

.nft-grid-edit {
  margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px;
  min-height: 90px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px;
}
.nft-card-edit {
  width: 80px; background: var(--ink); border: 2px solid var(--orange);
  border-radius: 8px; position: relative; overflow: hidden;
}
.nft-card-edit img { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }
.remove-btn {
  position: absolute; top: 2px; right: 2px; background: var(--red);
  color: #fff; border: 1px solid #000; border-radius: 50%; width: 18px; height: 18px;
  cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;
}

/* ─── AREA DE CAPTURA (LA TARJETA) ─── */
#capture-area {
  background: var(--paper2);
  border: 3px solid var(--ink);
  box-shadow: 8px 8px 0 var(--ink);
  border-radius: 4px;
  padding: 30px;
  width: 100%;
  max-width: 900px;
  margin: 20px auto;
}

.s-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.s-val-lg { font-size: clamp(40px, 8vw, 80px); color: var(--white); line-height: 1; }

.s-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.s-stat-item {
  background: var(--paper2); border: 2px solid var(--ink);
  padding: 10px; text-align: center; border-radius: 4px; box-shadow: 3px 3px 0 var(--ink);
}
.s-stat-item div { font-size: 12px; color: var(--orange); }
.s-stat-item b { font-size: 18px; color: #fff; }

/* ─── GRID DE NFTS EN LA TARJETA ─── */
.s-nft-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.s-group { border: 2px solid var(--ink); border-radius: 6px; padding: 10px; background: rgba(0,0,0,0.1); opacity: 0.3; }
.s-group.active { opacity: 1; border-color: var(--orange); }
.s-group-title { font-size: 20px; color: #fff; text-align: center; border-bottom: 2px solid var(--ink); margin-bottom: 10px; }

.s-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 50px; }
.s-img { 
  width: 70px; height: 70px; border: 3px solid var(--ink); 
  border-radius: 4px; overflow: hidden; box-shadow: 3px 3px 0 var(--ink); 
}
.s-img img { width: 100%; height: 100%; object-fit: cover; }

.s-footer { margin-top: 25px; display: flex; justify-content: space-between; align-items: center; border-top: 3px solid var(--ink); padding-top: 15px; }
.s-logo { height: 45px; }
.s-ref { font-size: 24px; color: #fff; }

/* ─── BOTONES ─── */
.actions { display: flex; gap: 12px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }
.btn-act {
  padding: 12px 24px; font-family: 'Bangers', cursive; font-size: 20px;
  cursor: pointer; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 4px;
}
.btn-act:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.btn-blue { background: var(--orange); color: #fff; }
.btn-green { background: #27ae60; color: #fff; }
.btn-tw { background: #1DA1F2; color: #fff; }

@media (max-width: 600px) {
  .main-grid { grid-template-columns: 1fr; }
  .s-stats { grid-template-columns: repeat(2, 1fr); }
  .s-nft-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="wrapper">
  <header>
    <img src="logotype_mark_white.png" alt="Hibachi" class="brand-logo">
    <div style="color:#fff; font-size: 24px; letter-spacing:2px;">POINTS CALCULATOR</div>
  </header>

  <div class="main-grid">
    <div class="panel">
      <h2>👤 Ninja Info</h2>
      <label>Your Points</label>
      <input type="number" id="inPoints" value="30000" oninput="update()">
      <label>Referral Code</label>
      <input type="text" id="inRef" placeholder="@YourName" oninput="update()">
    </div>

    <div class="panel">
      <h2>📈 Market Sim</h2>
      <div class="slider-row"><label>FDV ($)</label><span class="slider-val" id="valFdv">$500M</span></div>
      <input type="range" id="slFdv" min="50" max="3000" step="50" value="500" oninput="update()">
      <div class="slider-row"><label>Airdrop %</label><span class="slider-val" id="valAir">25%</span></div>
      <input type="range" id="slAir" min="1" max="100" value="25" oninput="update()">
      <div class="slider-row"><label>Total Points</label><span class="slider-val" id="valSupply">65M</span></div>
      <input type="range" id="slSupply" min="10" max="500" step="5" value="65" oninput="update()">
    </div>

    <div class="result-bar">
      <div class="res-item">
        <div class="res-lbl">ESTIMATED VALUE</div>
        <div class="res-val res-main" id="resTotal">$0</div>
      </div>
    </div>

    <div class="panel panel-full">
      <h2>🥷 My Collectibles (<span id="count">0</span>/9)</h2>
      <div class="tabs">
        <button class="tab-btn active" onclick="setTab('leg25',this)">Legendary 25</button>
        <button class="tab-btn" onclick="setTab('hid225',this)">Hidden 225</button>
        <button class="tab-btn" onclick="setTab('flame',this)">Flame Ninjas</button>
      </div>
      <div class="search-row">
        <input type="text" id="nftIn" placeholder="ID or Name..." onkeydown="if(event.key==='Enter') addNFT()">
        <button class="btn-add" onclick="addNFT()">ADD</button>
      </div>
      <div id="editGrid" class="nft-grid-edit"></div>
    </div>
  </div>

  <div id="capture-area">
    <div class="s-header">
      <div><div class="res-lbl">TOTAL POINTS</div><div class="s-val-lg" id="sPoints">0</div></div>
      <div style="text-align:right"><div class="res-lbl">EST. AIRDROP</div><div class="s-val-lg" id="sValue">$0</div></div>
    </div>

    <div class="s-stats">
      <div class="s-stat-item"><div>PRICE/PT</div><b id="sPpp">$0</b></div>
      <div class="s-stat-item"><div>FDV</div><b id="sFdv">$0</b></div>
      <div class="s-stat-item"><div>AIR %</div><b id="sAir">0%</b></div>
      <div class="s-stat-item"><div>SUPPLY</div><b id="sSupply">0M</b></div>
    </div>

    <div class="s-nft-grid">
      <div class="s-group" id="g-leg25"><div class="s-group-title">LEGENDARY 25</div><div class="s-row" id="r-leg25"></div></div>
      <div class="s-group" id="g-hid225"><div class="s-group-title">HIDDEN 225</div><div class="s-row" id="r-hid225"></div></div>
      <div class="s-group" id="g-flame"><div class="s-group-title">FLAME NINJAS</div><div class="s-row" id="r-flame"></div></div>
    </div>

    <div class="s-footer">
      <img src="logotype_mark_white.png" alt="Hibachi" class="s-logo">
      <div style="text-align:right"><div class="res-lbl" style="color:var(--orange)">REF CODE</div><div class="s-ref" id="sRef">---</div></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-act btn-blue" onclick="downloadCard(this)">⬇ DOWNLOAD IMAGE</button>
    <button class="btn-act btn-green" onclick="copyCard(this)">📋 COPY CLIPBOARD</button>
    <button class="btn-act btn-tw" onclick="tweetShare()">𝕏 SHARE ON X</button>
  </div>
</div>

<script>
const EXT = ".webp";
let currentTab = 'leg25';
let myNfts = { leg25: [], hid225: [], flame: [] };

const IMG_PATH = {
  leg25: id => `legendary/${id}${EXT}`,
  hid225: id => `hidden/${id}${EXT}`,
  flame: id => `flame/${id}${EXT}`
};

function setTab(t, btn) {
  currentTab = t;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderEditor();
}

function addNFT() {
  const input = document.getElementById('nftIn');
  const val = input.value.trim().toLowerCase();
  if (!val || Object.values(myNfts).flat().length >= 9) return;
  
  let found = null;
  const max = currentTab === 'leg25' ? 25 : (currentTab === 'hid225' ? 225 : 250);
  if (!isNaN(val) && +val >= 1 && +val <= max) found = { id: +val, name: '#' + val };
  
  if (found && !myNfts[currentTab].find(x => x.id === found.id)) {
    myNfts[currentTab].push(found);
    input.value = '';
    update();
  }
}

function removeNFT(tab, id) {
  myNfts[tab] = myNfts[tab].filter(x => x.id !== id);
  update();
}

function renderEditor() {
  const grid = document.getElementById('editGrid');
  grid.innerHTML = '';
  myNfts[currentTab].forEach(n => {
    grid.innerHTML += `<div class="nft-card-edit"><button class="remove-btn" onclick="removeNFT('${currentTab}',${n.id})">×</button><img src="${IMG_PATH[currentTab](n.id)}"></div>`;
  });
}

function update() {
  const pts = parseFloat(document.getElementById('inPoints').value) || 0;
  const fdv = parseFloat(document.getElementById('slFdv').value) * 1e6;
  const air = parseFloat(document.getElementById('slAir').value) / 100;
  const supply = parseFloat(document.getElementById('slSupply').value) * 1e6;
  const ppp = supply > 0 ? (fdv * air) / supply : 0;
  const total = ppp * pts;

  document.getElementById('valFdv').innerText = '$' + (fdv/1e6) + 'M';
  document.getElementById('valAir').innerText = (air*100) + '%';
  document.getElementById('valSupply').innerText = (supply/1e6) + 'M';
  document.getElementById('resTotal').innerText = '$' + total.toLocaleString('en-US', {maximumFractionDigits:0});

  document.getElementById('sPoints').innerText = pts.toLocaleString();
  document.getElementById('sValue').innerText = '$' + total.toLocaleString('en-US', {maximumFractionDigits:0});
  document.getElementById('sPpp').innerText = '$' + ppp.toFixed(4);
  document.getElementById('sFdv').innerText = '$' + (fdv/1e6) + 'M';
  document.getElementById('sAir').innerText = (air*100) + '%';
  document.getElementById('sSupply').innerText = (supply/1e6) + 'M';
  document.getElementById('sRef').innerText = document.getElementById('inRef').value || '---';

  renderEditor();
  let totalCount = 0;
  ['leg25','hid225','flame'].forEach(tab => {
    totalCount += myNfts[tab].length;
    const row = document.getElementById(`r-${tab}`);
    const group = document.getElementById(`g-${tab}`);
    row.innerHTML = '';
    if (myNfts[tab].length > 0) {
      group.classList.add('active');
      myNfts[tab].forEach(n => {
        row.innerHTML += `<div class="s-img"><img src="${IMG_PATH[tab](n.id)}"></div>`;
      });
    } else { group.classList.remove('active'); }
  });
  document.getElementById('count').innerText = totalCount;
}

async function captureCard() {
  const el = document.getElementById('capture-area');
  const canvas = await html2canvas(el, {
    useCORS: true, scale: 3, backgroundColor: '#0F0F15',
    onclone: (clonedDoc) => {
      clonedDoc.querySelectorAll('.s-group.active').forEach(g => g.style.opacity = "1");
    }
  });
  return canvas;
}

async function downloadCard(btn) {
  const old = btn.innerText; btn.innerText = 'WAIT...';
  try {
    const cvs = await captureCard();
    const link = document.createElement('a');
    link.download = 'hibachi-airdrop.png';
    link.href = cvs.toDataURL('image/png', 1.0);
    link.click();
    btn.innerText = '✅ DONE!';
  } catch(e) { btn.innerText = '❌ ERROR'; }
  setTimeout(() => btn.innerText = old, 2000);
}

async function copyCard(btn) {
  const old = btn.innerText; btn.innerText = 'COPYING...';
  try {
    const cvs = await captureCard();
    cvs.toBlob(async b => {
      await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
      btn.innerText = '✅ COPIED!';
    });
  } catch(e) { btn.innerText = '❌ ERROR'; }
  setTimeout(() => btn.innerText = old, 2000);
}

function tweetShare() {
  const val = document.getElementById('sValue').innerText;
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(`My estimated $HIBACHI airdrop is ${val} 🔥\n\n@hibachi_xyz #HibachiAirdrop`)}`, '_blank');
}

update();
</script>
</body>
</html>
